org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=4
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# [M3 Expressive · Path A 2026-10-27] AGP 9.x 内置 Kotlin 与 kapt 不兼容，而当前 Kotlin 2.4.20
# 暂无对应 KSP 版本可用，故关闭内置 Kotlin、回退外部 org.jetbrains.kotlin.android 插件 + kapt。
# 这是 AGP 官方为 kapt 不兼容给出的临时绕开开关（builtInKotlin + newDsl 同时关）。
android.builtInKotlin=false
android.newDsl=false
sdk.dir=E:\\Android\\Sdk
kapt.use.worker.api=false
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC
